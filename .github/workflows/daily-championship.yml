name: Campeonato diário

on:
  schedule:
    - cron: "17 0 * * *"             # todos os dias às 00:17, horário de Brasília
      timezone: "America/Sao_Paulo"
  workflow_dispatch:                 # permite rodar manualmente pela aba Actions

permissions:
  contents: write                    # necessário para gravar o resultado no repositório

concurrency:
  group: campeonato-diario           # nunca roda duas simulações ao mesmo tempo
  cancel-in-progress: false

jobs:
  simular:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Instalar o Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Simular o próximo campeonato
        id: sim
        working-directory: backend
        run: python run.py --next

      - name: Gravar o resultado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/league.json docs/data
          git commit -m "Campeonato ${{ steps.sim.outputs.season }}: ${{ steps.sim.outputs.champion }} campeão"
          git pull --rebase
          git push

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5