
name: Campeonato diário

on:
  schedule:
    - cron: "17 0 * * *"
      timezone: "America/Sao_Paulo"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: campeonato-diario
  cancel-in-progress: false

jobs:
  simular:
    name: Simular campeonato
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Instalar o Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Simular o próximo campeonato
        id: sim
        working-directory: backend
        run: python run.py --next

      - name: Gravar o resultado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/data/league.json docs/data

          if git diff --cached --quiet; then
            echo "Nenhuma alteração encontrada."
          else
            git commit -m "Campeonato ${{ steps.sim.outputs.season }}: ${{ steps.sim.outputs.champion }} campeão"
            git pull --rebase
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

  deploy:
    name: Publicar GitHub Pages
    needs: simular
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
